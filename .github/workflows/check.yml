name: Core checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm export:android
